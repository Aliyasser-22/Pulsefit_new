<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFit | Login</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e8f04a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--navy:#0d1b2a;--navy2:#132236;--accent:#e8f04a;--white:#f0f4f8;--muted:#7a90a8;--red:#f87171;--border:rgba(255,255,255,0.08);--radius:14px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background-image:radial-gradient(ellipse at 20% 20%,rgba(232,240,74,0.07) 0%,transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(74,200,240,0.05) 0%,transparent 45%)}
    .card{width:100%;max-width:420px;background:var(--navy2);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:4px;color:var(--accent);text-align:center;margin-bottom:0.3rem}
    .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:center;gap:8px}
    .field{margin-bottom:1.1rem}
    label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
    input{width:100%;padding:.85rem 1rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--radius);color:var(--white);font-family:inherit;font-size:1rem;transition:border-color .2s}
    input:focus{outline:none;border-color:var(--accent)}
    input.error{border-color:var(--red)}
    .btn{width:100%;padding:.95rem;background:var(--accent);color:var(--navy);border:none;border-radius:var(--radius);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err-msg{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:var(--red);border-radius:10px;padding:.75rem 1rem;font-size:.9rem;margin-bottom:1rem;display:none}
    .footer-link{text-align:center;margin-top:1.5rem;font-size:.9rem;color:var(--muted)}
    .footer-link a{color:var(--accent);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PulseFit</div>
    <p class="subtitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      Welcome back
    </p>
    <div class="err-msg" id="errMsg"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Login
    </button>
    <div class="footer-link">Don't have an account? <a href="/register">Sign up</a></div>
  </div>
  <script>
    async function doLogin(){
      const btn=document.getElementById('loginBtn');
      const err=document.getElementById('errMsg');
      const email=document.getElementById('email').value.trim();
      const pass=document.getElementById('password').value;
      err.style.display='none';
      
      if(!email||!pass){showErr('Please fill in all fields.');return;}
      
      btn.disabled=true;
      btn.textContent='Logging in...';
      
      try{
        const res=await fetch('/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password:pass})
        });
        const data=await res.json();
        
        if(!res.ok){
          showErr(data.error||'Login failed');
          btn.disabled=false;
          btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Login';
          return;
        }
        window.location.href=data.redirect||'/dashboard';
      }catch{
        showErr('Server error, try again.');
        btn.disabled=false;
        btn.textContent='Login';
      }
    }
    
    function showErr(msg){
      const e=document.getElementById('errMsg');
      e.textContent=msg;
      e.style.display='block';
    }
    
    // Enter key
    document.addEventListener('keydown', e => { 
      if (e.key === 'Enter') doLogin(); 
    });
  </script>
</body>
</html>
