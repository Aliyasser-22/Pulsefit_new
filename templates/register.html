<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFit | Register</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e8f04a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--navy:#0d1b2a;--navy2:#132236;--accent:#e8f04a;--white:#f0f4f8;--muted:#7a90a8;--red:#f87171;--border:rgba(255,255,255,0.08);--radius:14px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background-image:radial-gradient(ellipse at 20% 20%,rgba(232,240,74,0.07) 0%,transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(74,200,240,0.05) 0%,transparent 45%)}
    .card{width:100%;max-width:420px;background:var(--navy2);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:4px;color:var(--accent);text-align:center;margin-bottom:.3rem}
    .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:center;gap:8px}
    .field{margin-bottom:1.1rem}
    label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
    input{width:100%;padding:.85rem 1rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--radius);color:var(--white);font-family:inherit;font-size:1rem;transition:border-color .2s}
    input:focus{outline:none;border-color:var(--accent)}
    .hint{font-size:.78rem;color:var(--muted);margin-top:.3rem}
    .btn{width:100%;padding:.95rem;background:var(--accent);color:var(--navy);border:none;border-radius:var(--radius);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err-msg{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:var(--red);border-radius:10px;padding:.75rem 1rem;font-size:.9rem;margin-bottom:1rem;display:none}
    .footer-link{text-align:center;margin-top:1.5rem;font-size:.9rem;color:var(--muted)}
    .footer-link a{color:var(--accent);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PulseFit</div>
    <p class="subtitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Create your account
    </p>
    <div class="err-msg" id="errMsg"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. Ahmed123" autocomplete="username">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password">
      <p class="hint">At least 8 characters</p>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Create Account
    </button>
    <div class="footer-link">Already have an account? <a href="/login">Login</a></div>
  </div>
  <script>
    async function doRegister(){
      const btn=document.getElementById('regBtn');
      const username=document.getElementById('username').value.trim();
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      const confirm=document.getElementById('confirm').value;
      if(!username||!email||!password||!confirm){showErr('Please fill in all fields.');return;}
      if(password!==confirm){showErr('Passwords do not match.');return;}
      if(password.length<8){showErr('Password must be at least 8 characters.');return;}
      btn.disabled=true;btn.textContent='Creating account...';
      try{
        const res=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});
        const data=await res.json();
        if(!res.ok){showErr(data.error||'Registration failed');btn.disabled=false;btn.textContent='Create Account';return;}
        window.location.href=data.redirect||'/questionnaire';
      }catch{showErr('Server error, try again.');btn.disabled=false;btn.textContent='Create Account';}
    }
    function showErr(msg){const e=document.getElementById('errMsg');e.textContent=msg;e.style.display='block';}
    document.addEventListener('keydown',e=>{if(e.key==='Enter')doRegister();});
  </script>
</body>
</html>
